<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>多人線上 RPG 戰鬥房間</title>
  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", Microsoft JhengHei, sans-serif; }
    body { background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 15px; }

    .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    h2, h3 { margin-top: 0; color: #4caf50; }

    button { background-color: #388e3c; color: white; border: none; padding: 8px 16px; font-size: 14px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: #4caf50; }
    button:disabled { background-color: #444; color: #888; cursor: not-allowed; }
    input, select { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 4px; font-size: 14px; }

    .hidden { display: none !important; }

    .lobby-panel { display: flex; flex-direction: column; gap: 15px; }
    .lobby-content { display: flex; gap: 15px; flex-wrap: wrap; }
    .lobby-box { flex: 1; min-width: 280px; }

    .inventory-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .inventory-item { background: #2a2a2a; padding: 8px 12px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #ff9800; }

    .teams-container { display: flex; gap: 15px; margin-top: 10px; }
    .team-box { flex: 1; background: #252525; padding: 10px; border-radius: 6px; }
    .team-box.team-a { border-top: 4px solid #2196f3; }
    .team-box.team-b { border-top: 4px solid #f44336; }

    .player-card { background: #333; border-radius: 6px; padding: 10px; margin-bottom: 10px; position: relative; border: 2px solid transparent; transition: 0.2s; }
    .player-card.selected { border-color: #ffca28; background: #3d3b2a; }
    .player-card.dead { opacity: 0.5; filter: grayscale(1); }
    .player-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 6px; }
    
    .bar-container { background: #555; height: 14px; border-radius: 7px; overflow: hidden; margin-bottom: 4px; position: relative; }
    .hp-bar { background: linear-gradient(90deg, #e53935, #ef5350); height: 100%; width: 100%; transition: width 0.3s; }
    .mp-bar { background: linear-gradient(90deg, #1e88e5, #42a5f5); height: 100%; width: 100%; transition: width 0.3s; }
    .bar-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; font-size: 10px; text-align: center; line-height: 14px; text-shadow: 1px 1px 2px #000; }

    .action-panel { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .skill-btns, .item-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-ult { background: linear-gradient(135deg, #d32f2f, #7b1fa2); font-weight: bold; border: 1px solid #ff4081; }
    .btn-ult:hover { background: linear-gradient(135deg, #f44336, #9c27b0); }
    .btn-potion { background-color: #0288d1; }
    .btn-potion:hover { background-color: #03a9f4; }

    #battleLog { height: 160px; overflow-y: auto; background-color: #000; color: #00ff66; padding: 10px; font-family: monospace; font-size: 13px; border-radius: 4px; }
    .queue-status { margin-top: 10px; padding: 8px; background: #332200; border: 1px dashed #ff9800; border-radius: 4px; color: #ffca28; }
    .target-indicator { font-size: 13px; color: #ffca28; font-weight: bold; margin-bottom: 5px; }
  </style>
</head>
<body>

<div class="container">
  <h2>⚔️ 線上 RPG 戰鬥與匹配系統</h2>

  <!-- 大廳 -->
  <div id="lobbySection" class="card lobby-panel">
    <h3>🧘‍♂️ 大廳 (修練中...)</h3>
    <p id="idleStatusText" style="color: #aaa; margin: 0;">正在自動修練尋找藥水與道具...</p>
    
    <div class="lobby-content">
      <!-- 遊戲匹配 & 建立房間 -->
      <div class="lobby-box card">
        <h4>🎮 遊戲配對</h4>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label>玩家暱稱：<input type="text" id="playerName" value="勇者"></label>
          <label>選擇職業：
            <select id="playerRole">
              <option value="warrior">🛡️ 戰士 (16000 HP)</option>
              <option value="mage">🔮 法師 (9000 HP)</option>
              <option value="priest">💚 牧師 (10000 HP)</option>
              <option value="knight">🏰 騎士 (20000 HP)</option>
              <option value="assassin">🗡️ 刺客 (11000 HP)</option>
              <option value="archer">🏹 弓箭手 (10500 HP)</option>
            </select>
          </label>
          
          <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">
            <button id="btnJoinQueue" onclick="joinQueue()" style="background-color: #ff9800; font-weight: bold; font-size: 15px;">🎲 單人隨機匹配 (1v1)</button>
            <button id="btnLeaveQueue" onclick="leaveQueue()" class="hidden" style="background-color: #d32f2f;">❌ 取消匹配</button>
            
            <div id="queueStatus" class="queue-status hidden">⏳ 正在尋找對手 (1v1) 中...</div>
            <hr style="border-color: #333; width: 100%;">
            
            <div style="display: flex; gap: 8px;">
              <button onclick="createRoom()">自訂自建房間</button>
              <input type="text" id="joinRoomId" placeholder="輸入房號" style="width: 100px;">
              <button onclick="joinRoom()">加入房間</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 背包查看區塊 -->
      <div class="lobby-box card">
        <h4>🎒 我的背包道具</h4>
        <div class="inventory-list">
          <div class="inventory-item">
            <span>🧪 HP 藥水</span>
            <strong id="lobbyHpPotion">0</strong>
          </div>
          <div class="inventory-item">
            <span>🧪 MP 藥水</span>
            <strong id="lobbyMpPotion">0</strong>
          </div>
          <div class="inventory-item">
            <span>📜 經驗卷軸</span>
            <strong id="lobbyExpScroll">0</strong>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 戰鬥房間介面 -->
  <div id="roomSection" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3>🏰 戰鬥房間 - 房號: <span id="displayRoomId" style="color: #ff9800;">-</span></h3>
      <div>
        <button id="btnStartGame" onclick="startGame()" class="hidden">⚔️ 開始遊戲</button>
        <button id="btnRematch" onclick="rematch()" class="hidden">🔄 重新開局</button>
        <button onclick="leaveToIdle()" style="background-color: #d32f2f;">🚪 離開房間</button>
      </div>
    </div>

    <!-- 隊伍狀況 -->
    <div class="teams-container">
      <div class="team-box team-a">
        <h4 style="color: #2196f3; margin-top: 0;">🔵 隊伍 A</h4>
        <div id="teamAPlayers"></div>
      </div>
      <div class="team-box team-b">
        <h4 style="color: #f44336; margin-top: 0;">🔴 隊伍 B</h4>
        <div id="teamBPlayers"></div>
      </div>
    </div>

    <!-- 操作面板 -->
    <div id="actionPanel" class="action-panel hidden">
      <div id="currentTargetText" class="target-indicator">🎯 技能目標：[自動鎖定模式] (點擊上方玩家卡片可手動選擇)</div>
      <div>
        <span style="font-weight: bold; font-size: 14px;">✨ 釋放技能：</span>
        <div id="skillButtons" class="skill-btns" style="margin-top: 5px;"></div>
      </div>
      
      <div>
        <span style="font-weight: bold; font-size: 14px;">🧪 快捷道具：</span>
        <div class="item-btns" style="margin-top: 5px;">
          <button id="btnHpPotion" class="btn-potion" onclick="usePotion('hp')">🧪 HP 藥水 (剩餘: 0)</button>
          <button id="btnMpPotion" class="btn-potion" onclick="usePotion('mp')">🧪 MP 藥水 (剩餘: 0)</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 戰鬥日誌 -->
  <div class="card">
    <h3>📜 戰鬥與訊息日誌</h3>
    <div id="battleLog"></div>
  </div>
</div>

<script>
  let ws = new WebSocket('ws://localhost:8080');
  let myPlayerId = null;
  let currentRoomState = null;
  let selectedTargetId = null; // 當前手動選擇的目標

  const SKILLS = {
    mage: [
      { name: '🔥 火球術', mpCost: 80, minVal: 220, maxVal: 350, isAoe: false, isHeal: false },
      { name: '⚡ 連鎖閃電', mpCost: 150, minVal: 180, maxVal: 280, isAoe: false, isHeal: false },
      { name: '❄️ 暴風雪', mpCost: 220, minVal: 150, maxVal: 250, isAoe: true, isHeal: false },
      { name: '☄️ 隕石術', mpCost: 400, minVal: 500, maxVal: 850, isAoe: true, isHeal: false, isUlt: true }
    ],
    priest: [
      { name: '💚 治癒術', mpCost: 70, minVal: 200, maxVal: 320, isAoe: false, isHeal: true },
      { name: '✨ 聖光彈', mpCost: 90, minVal: 180, maxVal: 280, isAoe: false, isHeal: false },
      { name: '🙏 神聖祈禱', mpCost: 180, minVal: 150, maxVal: 250, isAoe: true, isHeal: true },
      { name: '🌟 天使降臨', mpCost: 350, minVal: 450, maxVal: 700, isAoe: true, isHeal: true, isUlt: true }
    ],
    warrior: [
      { name: '⚔️ 重擊', mpCost: 40, minVal: 180, maxVal: 300, isAoe: false, isHeal: false },
      { name: '🌪️ 旋風斬', mpCost: 100, minVal: 130, maxVal: 220, isAoe: true, isHeal: false },
      { name: '🩸 狂暴怒吼', mpCost: 120, minVal: 250, maxVal: 400, isAoe: false, isHeal: false },
      { name: '💥 英雄一擊', mpCost: 300, minVal: 550, maxVal: 900, isAoe: false, isHeal: false, isUlt: true }
    ],
    knight: [
      { name: '🛡️ 盾牌衝鋒', mpCost: 40, minVal: 150, maxVal: 240, isAoe: false, isHeal: false },
      { name: '🔨 裁決之錘', mpCost: 80, minVal: 200, maxVal: 320, isAoe: false, isHeal: false },
      { name: '🧱 堅守陣線', mpCost: 120, minVal: 120, maxVal: 200, isAoe: true, isHeal: true },
      { name: '🏰 正義風暴', mpCost: 280, minVal: 400, maxVal: 650, isAoe: true, isHeal: false, isUlt: true }
    ],
    assassin: [
      { name: '🗡️ 毒刃', mpCost: 50, minVal: 220, maxVal: 350, isAoe: false, isHeal: false },
      { name: '👣 影襲', mpCost: 90, minVal: 280, maxVal: 420, isAoe: false, isHeal: false },
      { name: '🔪 飛刀風暴', mpCost: 150, minVal: 160, maxVal: 280, isAoe: true, isHeal: false },
      { name: '☠️ 瞬獄殺', mpCost: 350, minVal: 650, maxVal: 1100, isAoe: false, isHeal: false, isUlt: true }
    ],
    archer: [
      { name: '🏹 精準射擊', mpCost: 50, minVal: 200, maxVal: 320, isAoe: false, isHeal: false },
      { name: '🌧️ 箭雨', mpCost: 140, minVal: 140, maxVal: 240, isAoe: true, isHeal: false },
      { name: '🎯 貫穿箭', mpCost: 110, minVal: 260, maxVal: 400, isAoe: false, isHeal: false },
      { name: '🦅 幻影神射', mpCost: 320, minVal: 580, maxVal: 950, isAoe: false, isHeal: false, isUlt: true }
    ]
  };

  ws.onopen = () => { logMessage("🟢 成功連接伺服器！進入修練掛機狀態..."); };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (data.type === 'idle_reward') {
      logMessage(data.message);
      updateInventoryDisplay(data.inventory);
    }
    else if (data.type === 'inventory_update') {
      updateInventoryDisplay(data.inventory);
    }
    else if (data.type === 'queue_joined') {
      logMessage("🎲 成功進入單人 1v1 匹配隊列，請稍候...");
      document.getElementById('btnJoinQueue').classList.add('hidden');
      document.getElementById('btnLeaveQueue').classList.remove('hidden');
      document.getElementById('queueStatus').classList.remove('hidden');
    }
    else if (data.type === 'queue_left') {
      logMessage("❌ 已取消匹配。");
      document.getElementById('btnJoinQueue').classList.remove('hidden');
      document.getElementById('btnLeaveQueue').classList.add('hidden');
      document.getElementById('queueStatus').classList.add('hidden');
    }
    else if (data.type === 'match_found') {
      logMessage("🎉 匹配成功 (1v1)！即將進入戰鬥...");
      myPlayerId = data.player.id;
      selectedTargetId = null;
      document.getElementById('displayRoomId').innerText = data.roomId;
      document.getElementById('lobbySection').classList.add('hidden');
      document.getElementById('roomSection').classList.remove('hidden');
      document.getElementById('btnJoinQueue').classList.remove('hidden');
      document.getElementById('btnLeaveQueue').classList.add('hidden');
      document.getElementById('queueStatus').classList.add('hidden');
      updateInventoryDisplay(data.player.inventory);
    }
    else if (data.type === 'room_created' || data.type === 'room_joined') {
      myPlayerId = data.player.id;
      selectedTargetId = null;
      document.getElementById('displayRoomId').innerText = data.roomId;
      document.getElementById('lobbySection').classList.add('hidden');
      document.getElementById('roomSection').classList.remove('hidden');
      updateInventoryDisplay(data.player.inventory);
    }
    else if (data.type === 'room_state') {
      currentRoomState = data;
      renderRoom(data);
    }
    else if (data.type === 'game_start') {
      logMessage(data.message);
    }
    else if (data.type === 'game_over') {
      logMessage(data.message);
    }
    else if (data.type === 'battle_log') {
      logMessage(data.message);
    }
    else if (data.type === 'returned_to_idle') {
      logMessage(data.message);
      selectedTargetId = null;
      document.getElementById('lobbySection').classList.remove('hidden');
      document.getElementById('roomSection').classList.add('hidden');
      document.getElementById('actionPanel').classList.add('hidden');
      ws.send(JSON.stringify({ type: 'get_inventory' }));
    }
    else if (data.type === 'error') {
      alert(data.message);
    }
  };

  function updateInventoryDisplay(inv) {
    if (!inv) return;
    document.getElementById('lobbyHpPotion').innerText = inv.hpPotion || 0;
    document.getElementById('lobbyMpPotion').innerText = inv.mpPotion || 0;
    document.getElementById('lobbyExpScroll').innerText = inv.expScroll || 0;

    const btnHp = document.getElementById('btnHpPotion');
    const btnMp = document.getElementById('btnMpPotion');

    const hpCount = inv.hpPotion || 0;
    const mpCount = inv.mpPotion || 0;

    btnHp.innerText = `🧪 HP 藥水 (剩餘: ${hpCount})`;
    btnHp.disabled = hpCount <= 0;

    btnMp.innerText = `🧪 MP 藥水 (剩餘: ${mpCount})`;
    btnMp.disabled = mpCount <= 0;
  }

  function renderRoom(roomState) {
    const teamA = document.getElementById('teamAPlayers');
    const teamB = document.getElementById('teamBPlayers');
    teamA.innerHTML = '';
    teamB.innerHTML = '';

    const me = roomState.players.find(p => p.id === myPlayerId);
    const isHost = roomState.players[0] && roomState.players[0].id === myPlayerId;

    if (me && me.inventory) updateInventoryDisplay(me.inventory);

    const btnStart = document.getElementById('btnStartGame');
    const btnRematch = document.getElementById('btnRematch');
    
    if (roomState.status === 'waiting') {
      btnStart.classList.toggle('hidden', !isHost);
      btnRematch.classList.add('hidden');
      document.getElementById('actionPanel').classList.add('hidden');
    } else if (roomState.status === 'playing') {
      btnStart.classList.add('hidden');
      btnRematch.classList.add('hidden');
      document.getElementById('actionPanel').classList.remove('hidden');
      renderSkillButtons(me);
    } else if (roomState.status === 'game_over') {
      btnStart.classList.add('hidden');
      btnRematch.classList.toggle('hidden', !isHost);
    }

    // 更新當前手動選擇的目標文字
    const targetText = document.getElementById('currentTargetText');
    if (selectedTargetId) {
      const targetPlayer = roomState.players.find(p => p.id === selectedTargetId);
      if (targetPlayer && targetPlayer.hp > 0) {
        targetText.innerText = `🎯 目前鎖定目標：${targetPlayer.name} (${targetPlayer.team}隊) [再次點擊可取消選取]`;
      } else {
        selectedTargetId = null; // 目標已死亡，清空並恢復自動鎖定
        targetText.innerText = `🎯 技能目標：[自動鎖定模式] (點擊上方玩家卡片可手動選擇)`;
      }
    } else {
      targetText.innerText = `🎯 技能目標：[自動鎖定模式] (點擊上方玩家卡片可手動選擇)`;
    }

    roomState.players.forEach(p => {
      const isDead = p.hp <= 0;
      const hpPercent = Math.max(0, (p.hp / p.maxHp) * 100);
      const mpPercent = Math.max(0, (p.mp / p.maxMp) * 100);

      const pCard = document.createElement('div');
      const isSelected = selectedTargetId === p.id;
      pCard.className = `player-card ${isDead ? 'dead' : ''} ${isSelected ? 'selected' : ''}`;
      
      // 點擊玩家卡片切換選取狀態
      if (roomState.status === 'playing' && !isDead) {
        pCard.style.cursor = 'pointer';
        pCard.onclick = () => selectTarget(p.id);
      }

      pCard.innerHTML = `
        <div class="player-header">
          <span>${p.name} (${p.role}) ${p.id === myPlayerId ? '⭐我' : ''}</span>
          <span>${isDead ? '💀 陣亡' : '存活'}</span>
        </div>
        <div class="bar-container">
          <div class="hp-bar" style="width: ${hpPercent}%;"></div>
          <div class="bar-text">HP: ${p.hp} / ${p.maxHp}</div>
        </div>
        <div class="bar-container">
          <div class="mp-bar" style="width: ${mpPercent}%;"></div>
          <div class="bar-text">MP: ${p.mp} / ${p.maxMp}</div>
        </div>
      `;

      if (p.team === 'A') teamA.appendChild(pCard);
      else teamB.appendChild(pCard);
    });
  }

  function selectTarget(playerId) {
    if (selectedTargetId === playerId) {
      selectedTargetId = null; // 切換取消
    } else {
      selectedTargetId = playerId;
    }
    if (currentRoomState) renderRoom(currentRoomState);
  }

  function renderSkillButtons(me) {
    if (!me) return;
    const container = document.getElementById('skillButtons');
    container.innerHTML = '';

    const mySkills = SKILLS[me.role] || [];
    mySkills.forEach(skill => {
      const btn = document.createElement('button');
      btn.innerText = `${skill.name} (MP: ${skill.mpCost})`;
      if (skill.isUlt) btn.className = 'btn-ult';
      btn.disabled = me.mp < skill.mpCost || me.hp <= 0;
      btn.onclick = () => useSkill(skill);
      container.appendChild(btn);
    });
  }

  function useSkill(skill) {
    ws.send(JSON.stringify({
      type: 'use_skill',
      skillName: skill.name,
      mpCost: skill.mpCost,
      minVal: skill.minVal,
      maxVal: skill.maxVal,
      isAoe: skill.isAoe,
      isHeal: skill.isHeal,
      isUlt: skill.isUlt || false,
      targetId: selectedTargetId
    }));
  }

  function usePotion(potionType) {
    ws.send(JSON.stringify({ type: 'use_potion', potionType: potionType }));
  }

  function joinQueue() {
    const name = document.getElementById('playerName').value;
    const role = document.getElementById('playerRole').value;
    ws.send(JSON.stringify({ type: 'join_queue', name, role }));
  }

  function leaveQueue() {
    ws.send(JSON.stringify({ type: 'leave_queue' }));
  }

  function createRoom() {
    const name = document.getElementById('playerName').value;
    const role = document.getElementById('playerRole').value;
    ws.send(JSON.stringify({ type: 'create_room', name, role }));
  }

  function joinRoom() {
    const name = document.getElementById('playerName').value;
    const role = document.getElementById('playerRole').value;
    const roomId = document.getElementById('joinRoomId').value;
    if (!roomId) return alert("請輸入房號！");
    ws.send(JSON.stringify({ type: 'join_room', name, role, roomId }));
  }

  function startGame() { ws.send(JSON.stringify({ type: 'start_game' })); }
  function rematch() { ws.send(JSON.stringify({ type: 'rematch' })); }
  function leaveToIdle() { ws.send(JSON.stringify({ type: 'go_idle' })); }

  function logMessage(msg) {
    const log = document.getElementById('battleLog');
    const item = document.createElement('div');
    item.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
    log.appendChild(item);
    log.scrollTop = log.scrollHeight;
  }
</script>

</body>
</html>
