<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>多人線上 RPG 戰鬥房間 - 完整功能版</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .panel { background: #1e1e1e; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; }
        button { background: #ff9800; border: none; padding: 8px 15px; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #f57c00; }
        input, select { padding: 8px; margin: 5px 0; background: #2c2c2c; border: 1px solid #444; color: white; border-radius: 4px; width: calc(100% - 18px); }
        .shop-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; background: #2a2a2a; padding: 8px; border-radius: 4px; }
        #log { background: #000; padding: 10px; height: 120px; overflow-y: auto; font-family: monospace; font-size: 13px; border-radius: 4px; }
    </style>
</head>
<body>
<div class="container">
    <h2>⚔️ 線上 RPG 戰鬥與房間系統</h2>

    <!-- 登入面板 -->
    <div class="panel" id="login-panel">
        <h3>帳號登入</h3>
        <input type="text" id="username" placeholder="請輸入玩家暱稱" value="勇者">
        <button id="login-btn">帳號登入</button>
    </div>

    <!-- 大廳面板 (登入後顯示) -->
    <div class="panel" id="lobby-panel" style="display:none;">
        <h3 id="lobby-status">大廳 (修練中...)</h3>
        
        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <h4>戰鬥選擇</h4>
                <label>選擇職業：</label>
                <select id="class-select">
                    <option value="劍士">劍士</option>
                    <option value="法師">法師</option>
                    <option value="刺客">刺客</option>
                </select>
                <br><br>
                <button id="match-btn" style="background:#2196F3; width:100%;">🌐 單人隨機匹配 (1v1)</button>
            </div>

            <div style="flex: 1;">
                <h4>🛒 道具商店</h4>
                <div class="shop-item">
                    <span>HP 藥水 (💰 50金幣)</span>
                    <button onclick="buyItem('hp_potion', 50)">購買</button>
                </div>
                <div class="shop-item">
                    <span>MP 藥水 (💰 50金幣)</span>
                    <button onclick="buyItem('mp_potion', 50)">購買</button>
                </div>
                <div class="shop-item">
                    <span>經驗卷軸 (💰 200金幣)</span>
                    <button onclick="buyItem('exp_scroll', 200)">購買</button>
                </div>
            </div>
        </div>

        <hr style="border-color:#444; margin: 15px 0;">

        <h4>🎒 我的背包 (資料庫同步)</h4>
        <p>金幣：<span id="gold-val">100</span> | HP藥水：<span id="hp-val">5</span> | MP藥水：<span id="mp-val">5</span> | 經驗卷軸：<span id="exp-val">0</span></p>
    </div>

    <!-- 系統日誌 -->
    <div class="panel">
        <h4>📜 戰鬥與系統日誌</h4>
        <div id="log"></div>
    </div>
</div>

<script>
    const socket = io();
    let currentUser = null;

    function log(msg) {
        const box = document.getElementById('log');
        box.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
        box.scrollTop = box.scrollHeight;
    }

    socket.on('connect', () => {
        log("成功連接伺服器！請進行帳號登入或註冊。");
    });

    document.getElementById('login-btn').addEventListener('click', () => {
        const name = document.getElementById('username').value.trim();
        if(!name) return alert("請輸入暱稱");
        
        currentUser = name;
        socket.emit('login', { username: name });
    });

    socket.on('login_success', (data) => {
        log(`登入成功！歡迎回來，${data.username}`);
        document.getElementById('login-panel').style.display = 'none';
        document.getElementById('lobby-panel').style.display = 'block';
        updateInventory(data.inventory);
    });

    // 單人隨機匹配點擊事件
    document.getElementById('match-btn').addEventListener('click', () => {
        const playerClass = document.getElementById('class-select').value;
        log("正在尋找 1V1 對戰對手...");
        socket.emit('start_matchmaking', { username: currentUser, playerClass });
    });

    socket.on('match_found', (data) => {
        log(`🎉 配對成功！對手是 ${data.opponent}，即將進入房間：${data.roomId}`);
    });

    function buyItem(itemType, cost) {
        socket.emit('buy_item', { username: currentUser, itemType, cost });
    }

    socket.on('inventory_update', (inventory) => {
        updateInventory(inventory);
        log("背包與金幣資料已同步更新。");
    });

    socket.on('shop_message', (msg) => {
        log(msg);
    });

    function updateInventory(inv) {
        document.getElementById('gold-val').innerText = inv.gold || 0;
        document.getElementById('hp-val').innerText = inv.hp_potion || 0;
        document.getElementById('mp-val').innerText = inv.mp_potion || 0;
        document.getElementById('exp-val').innerText = inv.exp_scroll || 0;
    }
</script>
</body>
</html>
