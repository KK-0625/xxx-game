<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>多人線上 RPG 戰鬥房間 - 完整功能版</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .panel { background: #1e1e1e; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; }
        button { background: #ff9800; border: none; padding: 8px 15px; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #f57c00; }
        input, select { padding: 8px; margin: 5px 0; background: #2c2c2c; border: 1px solid #444; color: white; border-radius: 4px; width: calc(100% - 18px); }
        .shop-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; background: #2a2a2a; padding: 8px; border-radius: 4px; }
        #log { background: #000; padding: 10px; height: 160px; overflow-y: auto; font-family: monospace; font-size: 13px; border-radius: 4px; }
        .chat-box { background: #181818; padding: 8px; height: 100px; overflow-y: auto; border: 1px solid #333; margin-bottom: 8px; font-size: 13px; }
        .player-card { background: #252525; padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #444; }
    </style>
</head>
<body>
<div class="container">
    <h2>⚔️ 線上 RPG 戰鬥與房間系統</h2>

    <!-- 1. 帳號登入 / 註冊面板 -->
    <div class="panel" id="auth-panel">
        <h3>🔐 帳號登入 / 註冊</h3>
        <input type="text" id="username-input" placeholder="請輸入玩家名稱" value="勇者">
        <input type="password" id="password-input" placeholder="請輸入密碼" value="123456">
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button id="login-btn" style="flex:1;">帳號登入</button>
            <button id="register-btn" style="flex:1; background:#4CAF50;">註冊新帳號</button>
        </div>
    </div>

    <!-- 2. 大廳面板 (登入後顯示) -->
    <div class="panel" id="lobby-panel" style="display:none;">
        <h3 id="lobby-status">🛡️ 大廳 (自動修練中，定時獲得金幣與藥水...)</h3>
        <p style="color: #4CAF50; font-size: 13px;">🟢 線上玩家人數: <span id="online-count">3000</span> 人</p>
        
        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <h4>⚔️ 戰鬥選擇</h4>
                <label>選擇職業：</label>
                <select id="role-select">
                    <option value="berserker">狂戰士 (高血量 / 攻擊吸血)</option>
                    <option value="mage">法師 (高魔力 / 強力AOE)</option>
                    <option value="priest">牧師 (治療與復活)</option>
                    <option value="knight">騎士 (超高血量 / 荊棘反傷)</option>
                    <option value="assassin">刺客 (高爆發 / 致命毒藥)</option>
                    <option value="archer">弓箭手 (遠距 / 致盲牽制)</option>
                </select>
                <br><br>
                <button id="match-btn" style="background:#2196F3; width:100%;">🌐 單人隨機匹配 (1v1 AI 補位)</button>
                <br><br>
                <div style="display: flex; gap: 5px;">
                    <button id="create-room-btn" style="background:#9c27b0; flex:1;">🏠 自建房</button>
                    <input type="text" id="room-id-input" placeholder="房號" style="margin:0; width:80px;">
                    <button id="join-room-btn" style="background:#00bcd4; width:80px;">加入房</button>
                </div>
            </div>

            <!-- 🛒 道具商店區塊 -->
            <div style="flex: 1;">
                <h4>🛒 道具商店</h4>
                <div class="shop-item">
                    <span>HP 藥水 (💰 10 金幣)</span>
                    <button onclick="buyItem('hp_potion')">購買</button>
                </div>
                <div class="shop-item">
                    <span>MP 藥水 (💰 10 金幣)</span>
                    <button onclick="buyItem('mp_potion')">購買</button>
                </div>
                <div class="shop-item">
                    <span>經驗卷軸 (💰 50 金幣)</span>
                    <button onclick="buyItem('exp_scroll')">購買</button>
                </div>
            </div>
        </div>

        <hr style="border-color:#444; margin: 15px 0;">

        <!-- 💬 大廳公眾聊天室 -->
        <h4>💬 大廳公眾聊天室</h4>
        <div id="lobby-chat-box" class="chat-box"></div>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="chat-input" placeholder="輸入聊天內容..." style="margin:0; flex:1;">
            <button id="chat-send-btn" style="width: 100px;">發送</button>
        </div>

        <hr style="border-color:#444; margin: 15px 0;">

        <h4>🎒 我的背包與個人資訊</h4>
        <p>等級：LV <span id="level-val">1</span> | 經驗：<span id="exp-val">0</span> / <span id="next-exp-val">100</span> | 段位：<span id="rank-name-val">青銅 🥉</span> (積分: <span id="rank-pts-val">0</span>)</p>
        <p>金幣：💰 <span id="gold-val">0</span> | HP藥水：🧪 <span id="hp-val">0</span> | MP藥水：🧪 <span id="mp-val">0</span> | 經驗卷軸：📜 <span id="scroll-val">0</span></p>
    </div>

    <!-- 3. 戰鬥房間面板 -->
    <div class="panel" id="room-panel" style="display:none;">
        <h3 id="room-title">⚔️ 戰鬥房間</h3>
        <div id="room-content"></div>
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button id="start-game-btn" style="background:#4CAF50;">開始戰鬥</button>
            <button id="switch-team-a-btn" style="background:#3f51b5;">切換至 隊伍 A</button>
            <button id="switch-team-b-btn" style="background:#e91e63;">切換至 隊伍 B</button>
            <button id="leave-room-btn" style="background:#f44336; margin-left:auto;">返回大廳</button>
        </div>
    </div>

    <!-- 4. 系統與戰鬥日誌 -->
    <div class="panel">
        <h4>📜 戰鬥與系統日誌</h4>
        <div id="log"></div>
    </div>
</div>

<script>
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${window.location.host}`);

    let myPlayerId = null;
    let currentRoomData = null;

    function log(msg) {
        const box = document.getElementById('log');
        box.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
        box.scrollTop = box.scrollHeight;
    }

    ws.onopen = () => {
        log("成功連接遊戲伺服器！請先登入或註冊帳號。");
    };

    // --- 帳號註冊 ---
    document.getElementById('register-btn').addEventListener('click', () => {
        const username = document.getElementById('username-input').value.trim();
        const password = document.getElementById('password-input').value.trim();
        if(!username || !password) return alert("請輸入完整帳號與密碼");
        ws.send(JSON.stringify({ type: 'register', username, password }));
    });

    // --- 帳號登入 ---
    document.getElementById('login-btn').addEventListener('click', () => {
        const username = document.getElementById('username-input').value.trim();
        const password = document.getElementById('password-input').value.trim();
        if(!username || !password) return alert("請輸入完整帳號與密碼");
        ws.send(JSON.stringify({ type: 'login', username, password }));
    });

    // --- 1v1 隨機匹配 ---
    document.getElementById('match-btn').addEventListener('click', () => {
        const role = document.getElementById('role-select').value;
        const name = document.getElementById('username-input').value.trim() || '勇者';
        log("正在加入 1V1 隨機匹配佇列 (若 3 秒內無真人將自動安排 AI 機器人)...");
        ws.send(JSON.stringify({ type: 'join_queue', role, name }));
    });

    // --- 自建房間 ---
    document.getElementById('create-room-btn').addEventListener('click', () => {
        const role = document.getElementById('role-select').value;
        const name = document.getElementById('username-input').value.trim() || '勇者';
        ws.send(JSON.stringify({ type: 'create_room', role, name, team: 'A' }));
    });

    // --- 加入房間 ---
    document.getElementById('join-room-btn').addEventListener('click', () => {
        const roomId = document.getElementById('room-id-input').value.trim();
        const role = document.getElementById('role-select').value;
        const name = document.getElementById('username-input').value.trim() || '勇者';
        if(!roomId) return alert("請輸入要加入的房號！");
        ws.send(JSON.stringify({ type: 'join_room', roomId, role, name }));
    });

    // --- 商店購買 ---
    function buyItem(itemType) {
        ws.send(JSON.stringify({ type: 'buy_item', itemType }));
    }

    // --- 大廳聊天發送 ---
    document.getElementById('chat-send-btn').addEventListener('click', () => {
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if(!message) return;
        ws.send(JSON.stringify({ type: 'send_lobby_chat', message }));
        input.value = '';
    });

    // --- 返回大廳 ---
    document.getElementById('leave-room-btn').addEventListener('click', () => {
        ws.send(JSON.stringify({ type: 'go_idle' }));
        document.getElementById('room-panel').style.display = 'none';
        document.getElementById('lobby-panel').style.display = 'block';
    });

    // --- 開始戰鬥 ---
    document.getElementById('start-game-btn').addEventListener('click', () => {
        ws.send(JSON.stringify({ type: 'start_game' }));
    });

    // --- 隊伍切換 ---
    document.getElementById('switch-team-a-btn').addEventListener('click', () => {
        ws.send(JSON.stringify({ type: 'switch_team', targetTeam: 'A' }));
    });
    document.getElementById('switch-team-b-btn').addEventListener('click', () => {
        ws.send(JSON.stringify({ type: 'switch_team', targetTeam: 'B' }));
    });

    // --- 接收 WebSocket 訊息 ---
    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'online_count') {
            document.getElementById('online-count').innerText = data.onlineCount;
        } else if (data.type === 'register_success') {
            log(data.message);
        } else if (data.type === 'login_success') {
            log(`登入成功！歡迎回來，${data.user.name}`);
            document.getElementById('auth-panel').style.display = 'none';
            document.getElementById('lobby-panel').style.display = 'block';
            updateUserData(data.user);
        } else if (data.type === 'shop_success') {
            log(data.message);
            updateInventory(data.inventory);
        } else if (data.type === 'queue_joined') {
            log("已成功加入配對佇列，正在尋找對手...");
        } else if (data.type === 'match_found' || data.type === 'room_created' || data.type === 'room_joined') {
            document.getElementById('lobby-panel').style.display = 'none';
            document.getElementById('room-panel').style.display = 'block';
            document.getElementById('room-title').innerText = `⚔️ 戰鬥房間編號: ${data.roomId}`;
            if(data.player) myPlayerId = data.player.id;
            log(`🎉 成功進入房間：${data.roomId}`);
        } else if (data.type === 'room_state') {
            currentRoomData = data;
            renderRoomState(data);
        } else if (data.type === 'battle_log') {
            log(data.message);
        } else if (data.type === 'lobby_chat') {
            const chatBox = document.getElementById('lobby-chat-box');
            chatBox.innerHTML += `[${data.time}] <b>${data.sender}</b>: ${data.message}<br>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        } else if (data.type === 'idle_reward') {
            log(data.message);
            updateInventory(data.inventory);
            document.getElementById('level-val').innerText = data.level;
            document.getElementById('exp-val').innerText = data.exp;
            document.getElementById('next-exp-val').innerText = data.nextExp;
            document.getElementById('rank-name-val').innerHTML = `${data.rankInfo.icon} ${data.rankInfo.name}`;
            document.getElementById('rank-pts-val').innerText = data.rankPoints;
        } else if (data.type === 'error') {
            log(`⚠️ 提示：${data.message}`);
        }
    };

    function updateInventory(inv) {
        document.getElementById('gold-val').innerText = inv.gold || 0;
        document.getElementById('hp-val').innerText = inv.hpPotion || 0;
        document.getElementById('mp-val').innerText = inv.mpPotion || 0;
        document.getElementById('scroll-val').innerText = inv.expScroll || 0;
    }

    function updateUserData(user) {
        updateInventory(user.inventory);
        document.getElementById('level-val').innerText = user.level || 1;
        document.getElementById('exp-val').innerText = user.exp || 0;
        document.getElementById('rank-name-val').innerHTML = `${user.rankInfo.icon} ${user.rankInfo.name}`;
        document.getElementById('rank-pts-val').innerText = user.rankPoints || 0;
    }

    // 職業專屬技能清單
    const SKILLS_BY_ROLE = {
        berserker: [
            { name: '重斬', minVal: 800, maxVal: 1200, mpCost: 200 },
            { name: '血性狂暴 (吸血)', minVal: 1500, maxVal: 2200, mpCost: 500, lifesteal: 0.5 },
            { name: '泰山壓頂 (AOE)', minVal: 1200, maxVal: 1800, mpCost: 800, isAoe: true }
        ],
        mage: [
            { name: '火球術', minVal: 1000, maxVal: 1600, mpCost: 300, effect: 'burn', chance: 0.4 },
            { name: '閃電風暴 (AOE)', minVal: 1800, maxVal: 2800, mpCost: 900, effect: 'paralyze', chance: 0.3, isAoe: true },
            { name: '隕石天降 (大招)', minVal: 3500, maxVal: 5000, mpCost: 1500, isAoe: true }
        ],
        priest: [
            { name: '聖光治愈', minVal: 1500, maxVal: 2500, mpCost: 400, isHeal: true },
            { name: '群體治癒 (AOE)', minVal: 1200, maxVal: 2000, mpCost: 900, isHeal: true, isAoe: true },
            { name: '神聖復活', minVal: 0, maxVal: 0, mpCost: 1200, isRevive: true }
        ],
        knight: [
            { name: '盾擊', minVal: 500, maxVal: 900, mpCost: 150 },
            { name: '聖盾護體', minVal: 1000, maxVal: 1500, mpCost: 400, isHeal: true },
            { name: '十字審判', minVal: 2000, maxVal: 3000, mpCost: 800 }
        ],
        assassin: [
            { name: '背刺', minVal: 1200, maxVal: 1800, mpCost: 300 },
            { name: '劇毒突襲', minVal: 1500, maxVal: 2200, mpCost: 500, effect: 'poison', chance: 0.6 },
            { name: '影襲爆發', minVal: 3000, maxVal: 4500, mpCost: 1200 }
        ],
        archer: [
            { name: '強力射擊', minVal: 900, maxVal: 1400, mpCost: 250 },
            { name: '致盲箭雨', minVal: 1300, maxVal: 1900, mpCost: 600, effect: 'blind', chance: 0.5, isAoe: true },
            { name: '萬箭齊發', minVal: 2500, maxVal: 3800, mpCost: 1100, isAoe: true }
        ]
    };

    function useSkill(skill) {
        ws.send(JSON.stringify({
            type: 'use_skill',
            skillName: skill.name,
            minVal: skill.minVal,
            maxVal: skill.maxVal,
            mpCost: skill.mpCost,
            isHeal: skill.isHeal || false,
            isAoe: skill.isAoe || false,
            isRevive: skill.isRevive || false,
            lifesteal: skill.lifesteal || 0,
            effect: skill.effect || null,
            chance: skill.chance || 0
        }));
    }

    function useBattlePotion(potionType) {
        ws.send(JSON.stringify({ type: 'use_potion', potionType }));
    }

    function renderRoomState(data) {
        const content = document.getElementById('room-content');
        let html = `<h4>房間狀態: ${data.status === 'playing' ? '⚔️ 戰鬥進行中 (每秒回 50 MP)' : '🛡️ 等待玩家準備中'}</h4>`;
        html += `<div style="display: flex; gap: 15px;">`;
        
        ['A', 'B'].forEach(team => {
            html += `<div style="flex:1; background:#222; padding:12px; border-radius:6px; border:1px solid #333;">`;
            html += `<h5>🔵 隊伍 ${team}</h5>`;
            const teamPlayers = data.players.filter(p => p.team === team);
            if(teamPlayers.length === 0) {
                html += `<p style="color:#777; font-size:13px;">尚無成員</p>`;
            } else {
                teamPlayers.forEach(p => {
                    const isMe = (p.id === myPlayerId);
                    const hpPercent = Math.max(0, Math.min(100, (p.hp / p.maxHp) * 100));
                    const mpPercent = Math.max(0, Math.min(100, (p.mp / p.maxMp) * 100));

                    html += `<div class="player-card" style="${isMe ? 'border-color:#ff9800;' : ''}">`;
                    html += `<b>${p.name}</b> ${isMe ? '(你)' : ''} (${p.role}) [${p.rankInfo.icon} ${p.rankInfo.name}]<br>`;
                    html += `<div style="font-size:12px; margin:4px 0;">`;
                    html += `HP: ${p.hp} / ${p.maxHp}<br><div style="background:#444; height:6px; border-radius:3px; margin-bottom:3px;"><div style="background:#f44336; width:${hpPercent}%; height:100%; border-radius:3px;"></div></div>`;
                    html += `MP: ${p.mp} / ${p.maxMp}<br><div style="background:#444; height:6px; border-radius:3px;"><div style="background:#2196F3; width:${mpPercent}%; height:100%; border-radius:3px;"></div></div>`;
                    html += `</div>`;

                    if (p.statusEffects) {
                        let effStr = '';
                        if (p.statusEffects.burn) effStr += '🔥灼燒 ';
                        if (p.statusEffects.paralyze) effStr += '⚡麻痺 ';
                        if (p.statusEffects.poison) effStr += '☠️中毒 ';
                        if (p.statusEffects.blind) effStr += '👁️致盲 ';
                        if (effStr) html += `<span style="color:#ffeb3b; font-size:11px;">狀態: ${effStr}</span><br>`;
                    }

                    // 如果是自己的角色且遊戲正在進行中，渲染技能按鈕與藥水按鈕
                    if (isMe && data.status === 'playing' && p.hp > 0) {
                        html += `<div style="margin-top:8px; border-top:1px dashed #444; padding-top:6px;">`;
                        html += `<b style="font-size:11px; color:#aaa;">可用技能：</b><br>`;
                        const skills = SKILLS_BY_ROLE[p.role] || SKILLS_BY_ROLE.berserker;
                        skills.forEach(s => {
                            html += `<button onclick='useSkill(${JSON.stringify(s)})' style="background:#673ab7; font-size:11px; padding:4px 8px; margin:2px 2px 0 0;">${s.name} (MP:${s.mpCost})</button>`;
                        });

                        html += `<div style="margin-top:5px;">`;
                        html += `<button onclick="useBattlePotion('hp')" style="background:#e91e63; font-size:11px; padding:3px 6px; margin-right:4px;">🧪 HP水 (${p.inventory?.hpPotion || 0})</button>`;
                        html += `<button onclick="useBattlePotion('mp')" style="background:#00bcd4; font-size:11px; padding:3px 6px;">🧪 MP水 (${p.inventory?.mpPotion || 0})</button>`;
                        html += `</div>`;
                        html += `</div>`;
                    }
                    html += `</div>`;
                });
            }
            html += `</div>`;
        });
        html += `</div>`;
        content.innerHTML = html;
    }
</script>
</body>
</html>
