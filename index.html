<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多人線上 RPG 戰鬥房間 - 完整儲值與審核後台版</title>
  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", Microsoft JhengHei, sans-serif; }
    
    body { 
      background-color: #121212; 
      color: #e0e0e0; 
      margin: 0; 
      padding: 20px; 
      display: flex; 
      justify-content: center; 
      overflow-x: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    input, select, textarea { user-select: text; }
    img { pointer-events: none; }

    .container { width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 15px; position: relative; }
    .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    h2, h3, h4 { margin-top: 0; color: #4caf50; }
    button { background-color: #388e3c; color: white; border: none; padding: 8px 16px; font-size: 14px; border-radius: 4px; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; }
    button:hover { background-color: #4caf50; }
    button:disabled { background-color: #444; color: #888; cursor: not-allowed; }
    input, select, textarea { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 4px; font-size: 14px; width: 100%; }
    .hidden { display: none !important; }
    .lobby-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px; }
    .online-badge { background: #2a3a2a; color: #66bb6a; border: 1px solid #4caf50; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; }
    .lobby-panel { display: flex; flex-direction: column; gap: 15px; }
    .lobby-content { display: flex; gap: 15px; flex-wrap: wrap; }
    .lobby-box { flex: 1; min-width: 280px; }
    .chat-box { height: 160px; overflow-y: auto; background-color: #141414; border: 1px solid #333; border-radius: 4px; padding: 8px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .chat-msg { word-break: break-all; }
    .chat-time { color: #666; font-size: 11px; margin-right: 5px; }
    .chat-sender { color: #ffca28; font-weight: bold; margin-right: 5px; }
    .admin-section { margin-top: 15px; background: #252525; padding: 12px; border-radius: 6px; border: 1px solid #444; }
  </style>
</head>
<body>

  <div class="container">
    <!-- 遊戲大廳與公告管理面板 -->
    <div class="card lobby-panel">
      <div class="lobby-header">
        <h2>多人線上 RPG 戰鬥房間</h2>
        <span class="online-badge" id="onlineCount">線上人數: 1</span>
      </div>

      <div class="lobby-content">
        <!-- 左側：聊天與互動 -->
        <div class="lobby-box">
          <h3>大廳聊天室</h3>
          <div class="chat-box" id="chatBox">
            <div class="chat-msg"><span class="chat-time">[12:00]</span><span class="chat-sender">系統</span>歡迎來到遊戲大廳！</div>
          </div>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="chatInput" placeholder="輸入訊息...">
            <button id="sendChatBtn">發送</button>
          </div>
        </div>

        <!-- 右側：公告與後台管理 -->
        <div class="lobby-box">
          <h3>公告管理</h3>
          <div class="admin-section">
            <h4>發布更新公告</h4>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <input type="text" id="announcementTitle" placeholder="請輸入公告標題...">
              <textarea id="announcementContent" rows="3" placeholder="請輸入公告內容..."></textarea>
              <button id="publishAnnouncementBtn">發布公告</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const publishBtn = document.getElementById('publishAnnouncementBtn');
      const titleInput = document.getElementById('announcementTitle');
      const contentInput = document.getElementById('announcementContent');
      const chatBox = document.getElementById('chatBox');

      // 修正：綁定發布更新公告點擊事件
      if (publishBtn) {
        publishBtn.addEventListener('click', () => {
          const title = titleInput.value.trim();
          const content = contentInput.value.trim();

          if (!title || !content) {
            alert('公告標題與內容不得為空！');
            return;
          }

          // 模擬發布成功並推播至聊天室與後台
          const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          
          const msgDiv = document.createElement('div');
          msgDiv.className = 'chat-msg';
          msgDiv.innerHTML = `<span class="chat-time">[${timeStr}]</span><span class="chat-sender" style="color:#e91e63;">[系統公告]</span> <b>${escapeHtml(title)}</b>: ${escapeHtml(content)}`;
          chatBox.appendChild(msgDiv);
          chatBox.scrollTop = chatBox.scrollHeight;

          alert('公告發布成功！');
          
          // 清空輸入框
          titleInput.value = '';
          contentInput.value = '';
        });
      }

      // 聊天室發送按鈕
      const sendChatBtn = document.getElementById('sendChatBtn');
      const chatInput = document.getElementById('chatInput');
      
      if (sendChatBtn) {
        sendChatBtn.addEventListener('click', () => {
          const text = chatInput.value.trim();
          if (!text) return;
          const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          
          const msgDiv = document.createElement('div');
          msgDiv.className = 'chat-msg';
          msgDiv.innerHTML = `<span class="chat-time">[${timeStr}]</span><span class="chat-sender">玩家</span>${escapeHtml(text)}`;
          chatBox.appendChild(msgDiv);
          chatBox.scrollTop = chatBox.scrollHeight;
          chatInput.value = '';
        });
      }
    });

    // 簡單的防 XSS 跳脫函式
    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }
  </script>
</body>
</html>
