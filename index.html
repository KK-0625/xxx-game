<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>多人線上 RPG 戰鬥房間 - 完整功能版</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .panel { background: #1e1e1e; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; }
        button { background: #ff9800; border: none; padding: 8px 15px; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #f57c00; }
        input, select { padding: 8px; margin: 5px 0; background: #2c2c2c; border: 1px solid #444; color: white; border-radius: 4px; width: calc(100% - 18px); }
        .shop-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; background: #2a2a2a; padding: 8px; border-radius: 4px; }
        #log { background: #000; padding: 10px; height: 160px; overflow-y: auto; font-family: monospace; font-size: 13px; border-radius: 4px; }
        .chat-box { background: #181818; padding: 8px; height: 100px; overflow-y: auto; border: 1px solid #333; margin-bottom: 8px; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <h2>⚔️ 線上 RPG 戰鬥與房間系統</h2>

    <!-- 帳號登入 / 註冊面板 -->
    <div class="panel" id="auth-panel">
        <h3>🔐 帳號登入 / 註冊</h3>
        <input type="text" id="username-input" placeholder="請輸入玩家名稱" value="勇者">
        <input type="password" id="password-input" placeholder="請輸入密碼" value="123456">
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button id="login-btn" style="flex:1;">帳號登入</button>
            <button id="register-btn" style="flex:1; background:#4CAF50;">註冊新帳號</button>
        </div>
    </div>

    <!-- 大廳面板 (登入後顯示) -->
    <div class="panel" id="lobby-panel" style="display:none;">
        <h3 id="lobby-status">🛡️ 大廳 (修練中...)</h3>
        
        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <h4>⚔️ 戰鬥選擇</h4>
                <label>選擇職業：</label>
                <select id="role-select">
                    <option value="berserker">狂戰士</option>
                    <option value="mage">法師</option>
                    <option value="priest">牧師</option>
                    <option value="knight">騎士</option>
                    <option value="assassin">刺客</option>
                    <option value="archer">弓箭手</option>
                </select>
                <br><br>
                <button id="match-btn" style="background:#2196F3; width:100%;">🌐 單人隨機匹配 (1v1)</button>
                <br><br>
                <button id="create-room-btn" style="background:#9c27b0; width:100%;">🏠 自建房間</button>
            </div>

            <!-- 🛒 完整的商店介面區塊 -->
            <div style="flex: 1;">
                <h4>🛒 道具商店</h4>
                <div class="shop-item">
                    <span>HP 藥水 (💰 10 金幣)</span>
                    <button onclick="buyItem('hp_potion')">購買</button>
                </div>
                <div class="shop-item">
                    <span>MP 藥水 (💰 10 金幣)</span>
                    <button onclick="buyItem('mp_potion')">購買</button>
                </div>
                <div class="shop-item">
                    <span>經驗卷軸 (💰 50 金幣)</span>
                    <button onclick="buyItem('exp_scroll')">購買</button>
                </div>
            </div>
        </div>

        <hr style="border-color:#444; margin: 15px 0;">

        <!-- 💬 大廳公眾聊天室 -->
        <h4>💬 大廳公眾聊天室</h4>
        <div id="lobby-chat-box" class="chat-box"></div>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="chat-input" placeholder="輸入聊天內容..." style="margin:0; flex:1;">
            <button id="chat-send-btn" style="width: 100px;">發送</button>
        </div>

        <hr style="border-color:#444; margin: 15px 0;">

        <h4>🎒 我的背包與個人資訊</h4>
        <p>等級：LV <span id="level-val">1</span> | 經驗：<span id="exp-val">0</span>/<span id="next-exp-val">100</span> | 段位：<span id="rank-name-val">青銅 🥉</span> (積分: <span id="rank-pts-val">0</span>)</p>
        <p>金幣：💰 <span id="gold-val">0</span> | HP藥水：🧪 <span id="hp-val">0</span> | MP藥水：🧪 <span id="mp-val">0</span> | 經驗卷軸：📜 <span id="scroll-val">0</span></p>
    </div>

    <!-- 戰鬥房間面板 -->
    <div class="panel" id="room-panel" style="display:none;">
        <h3 id="room-title">⚔️ 戰鬥房間</h3>
        <div id="room-content"></div>
        <div style="margin-top: 15px;">
            <button id="start-game-btn" style="background:#4CAF50;">開始戰鬥</button>
            <button id="leave-room-btn" style="background:#f44336;">返回大廳</button>
        </div>
    </div>

    <!-- 系統與戰鬥日誌 -->
    <div class="panel">
        <h4>📜 戰鬥與系統日誌</h4>
        <div id="log"></div>
    </div>
</div>

<script>
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${window.location.host}`);

    function log(msg) {
        const box = document.getElementById('log');
        box.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
        box.scrollTop = box.scrollHeight;
    }

    ws.onopen = () => {
        log("成功連接遊戲伺服器！請先登入或註冊。");
    };

    // 帳號註冊
    document.getElementById('register-btn').addEventListener('click', () => {
        const username = document.getElementById('username-input').value.trim();
        const password = document.getElementById('password-input').value.trim();
        if(!username || !password) return alert("請輸入完整帳號與密碼");
        ws.send(JSON.stringify({ type: 'register', username, password }));
    });

    // 帳號登入
    document.getElementById('login-btn').addEventListener('click', () => {
        const username = document.getElementById('username-input').value.trim();
        const password = document.getElementById('password-input').value.trim();
        if(!username || !password) return alert("請輸入完整帳號與密碼");
        ws.send(JSON.stringify({ type: 'login', username, password }));
    });

    // 單人隨機匹配按鈕 (已修復點擊無反應問題)
    document.getElementById('match-btn').addEventListener('click', () => {
        const role = document.getElementById('role-select').value;
        const name = document.getElementById('username-input').value.trim() || '勇者';
        log("正在加入 1V1 隨機匹配佇列...");
        ws.send(JSON.stringify({ type: 'join_queue', role, name }));
    });

    // 自建房間
    document.getElementById('create-room-btn').addEventListener('click', () => {
        const role = document.getElementById('role-select').value;
        const name = document.getElementById('username-input').value.trim() || '勇者';
        ws.send(JSON.stringify({ type: 'create_room', role, name, team: 'A' }));
    });

    // 商店購買
    function buyItem(itemType) {
        ws.send(JSON.stringify({ type: 'buy_item', itemType }));
    }

    // 大廳聊天發送
    document.getElementById('chat-send-btn').addEventListener('click', () => {
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if(!message) return;
        ws.send(JSON.stringify({ type: 'send_lobby_chat', message }));
        input.value = '';
    });

    // 返回大廳
    document.getElementById('leave-room-btn').addEventListener('click', () => {
        ws.send(JSON.stringify({ type: 'go_idle' }));
        document.getElementById('room-panel').style.display = 'none';
        document.getElementById('lobby-panel').style.display = 'block';
    });

    // 開始遊戲
    document.getElementById('start-game-btn').addEventListener('click', () => {
        ws.send(JSON.stringify({ type: 'start_game' }));
    });

    // 接收 WebSocket 訊息
    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'register_success') {
            log(data.message);
        } else if (data.type === 'login_success') {
            log(`登入成功！歡迎回來，${data.user.name}`);
            document.getElementById('auth-panel').style.display = 'none';
            document.getElementById('lobby-panel').style.display = 'block';
            updateUserData(data.user);
        } else if (data.type === 'shop_success') {
            log(data.message);
            updateInventory(data.inventory);
        } else if (data.type === 'queue_joined') {
            log("已成功加入配對佇列，正在尋找對手...");
        } else if (data.type === 'match_found' || data.type === 'room_created' || data.type === 'room_joined') {
            document.getElementById('lobby-panel').style.display = 'none';
            document.getElementById('room-panel').style.display = 'block';
            document.getElementById('room-title').innerText = `⚔️ 戰鬥房間編號: ${data.roomId}`;
            log(`🎉 成功進入房間：${data.roomId}`);
        } else if (data.type === 'room_state') {
            renderRoomState(data);
        } else if (data.type === 'battle_log') {
            log(data.message);
        } else if (data.type === 'lobby_chat') {
            const chatBox = document.getElementById('lobby-chat-box');
            chatBox.innerHTML += `[${data.time}] <b>${data.sender}</b>: ${data.message}<br>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        } else if (data.type === 'idle_reward') {
            log(data.message);
            updateInventory(data.inventory);
            document.getElementById('level-val').innerText = data.level;
            document.getElementById('exp-val').innerText = data.exp;
            document.getElementById('next-exp-val').innerText = data.nextExp;
            document.getElementById('rank-name-val').innerHTML = `${data.rankInfo.icon} ${data.rankInfo.name}`;
            document.getElementById('rank-pts-val').innerText = data.rankPoints;
        } else if (data.type === 'error') {
            log(`⚠️ 提示：${data.message}`);
        }
    };

    function updateInventory(inv) {
        document.getElementById('gold-val').innerText = inv.gold || 0;
        document.getElementById('hp-val').innerText = inv.hpPotion || 0;
        document.getElementById('mp-val').innerText = inv.mpPotion || 0;
        document.getElementById('scroll-val').innerText = inv.expScroll || 0;
    }

    function updateUserData(user) {
        updateInventory(user.inventory);
        document.getElementById('level-val').innerText = user.level || 1;
        document.getElementById('exp-val').innerText = user.exp || 0;
        document.getElementById('rank-name-val').innerHTML = `${user.rankInfo.icon} ${user.rankInfo.name}`;
        document.getElementById('rank-pts-val').innerText = user.rankPoints || 0;
    }

    function renderRoomState(data) {
        const content = document.getElementById('room-content');
        let html = `<h4>房間狀態: ${data.status === 'playing' ? '⚔️ 戰鬥中' : '🛡️ 等待中'}</h4>`;
        html += `<div style="display: flex; gap: 20px;">`;
        
        ['A', 'B'].forEach(team => {
            html += `<div style="flex:1; background:#252525; padding:10px; border-radius:6px;">`;
            html += `<h5>隊伍 ${team}</h5>`;
            const teamPlayers = data.players.filter(p => p.team === team);
            if(teamPlayers.length === 0) {
                html += `<p style="color:#777;">尚無成員</p>`;
            } else {
                teamPlayers.forEach(p => {
                    html += `<div style="margin-bottom:8px; border-bottom:1px dashed #444; padding-bottom:5px;">`;
                    html += `<b>${p.name}</b> (${p.role}) [${p.rankInfo.icon} ${p.rankInfo.name}]<br>`;
                    html += `HP: ${p.hp}/${p.maxHp} | MP: ${p.mp}/${p.maxMp}<br>`;
                    html += `</div>`;
                });
            }
            html += `</div>`;
        });
        html += `</div>`;
        content.innerHTML = html;
    }
</script>
</body>
</html>
